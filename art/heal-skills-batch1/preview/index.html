<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>治疗系第一批 · 资源预览</title><style>
body{margin:0;background:#10201b;color:#e3ead8;font:16px system-ui}main{max-width:760px;margin:auto;padding:18px}h1{font-size:23px}button,select,input{font:inherit;margin:4px;padding:7px;background:#243e33;color:#eef0d8;border:1px solid #667a75;border-radius:6px}.stage{position:relative;width:720px;height:420px;background:url(stage-reference.webp) center/100% 100%;overflow:hidden;transform-origin:top left}.clip{position:absolute;inset:85px 0 35px;overflow:hidden}.layer{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}.viewport{width:100%;overflow:hidden}#status{min-height:30px;color:#a0dbba}label{display:inline-block}small{color:#a5b5a7}input[type=range]{width:100px}.simulation{position:absolute;top:50px;left:28px;padding:2px 5px;background:#18372e;color:#d4efd9;font-size:16px}.hp{position:absolute;left:29px;top:45px;width:181px;height:6px;background:#23352a}.hp>i{display:block;height:6px;background:#a3d196}#ratio{color:#bfddb2}</style>
<main><h1>凝露诀 · 回春术 · 生生不息</h1><p>透明动画资源试播 · 尚未接入游戏。角色为固定比例参照。</p><select id="skill"></select><button id="play">暂停</button><button id="restart">重播</button><button id="step">下一帧</button><br><label><input type="checkbox" id="loop" checked>循环</label><label><input type="checkbox" id="reduced">减少动态</label><label><input type="checkbox" id="heal" checked>模拟缺血恢复</label><label><input type="checkbox" id="cancel">模拟退出</label><br><label>速度<select id="speed"><option value="1">正常</option><option value="0.5">半速</option></select></label><label>帧率<select id="fps"><option value="30">30 FPS</option><option value="60">60 FPS</option><option value="15">15 FPS</option></select></label><label>背景<select id="bg"><option value="stage">游戏场景</option><option value="#e7e0c8">浅色</option><option value="#59676b">中灰</option><option value="#101920">深色</option></select></label><label>缩放<input type="range" id="scale" min="0.6" max="1.3" step="0.05" value="1"></label><label>X<input id="x" type="number" min="-80" max="80" value="0"></label><label>Y<input id="y" type="number" min="-40" max="40" value="0"></label><div id="ratio"></div><div id="status"></div><div class="viewport"><div class="stage"><div class="hp"><i id="hpFill"></i></div><div class="simulation" id="hpText"></div><div class="clip" id="effects"></div></div></div><p><small>仅模拟一次即时恢复，动画不产生治疗。关闭“模拟缺血恢复”可检查满血时的弱起势与消散；上方血量为模拟显示。最终需接入真实战斗验收。</small></p></main><script src="definition.js"></script><script src="choreography.js"></script><script src="preview.js"></script></html>
