<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>火系第三批 · 三招试播 · 资源试播</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#24191d;color:#f1dedb;font:15px system-ui}main{max-width:940px;margin:auto;padding:22px 16px}h1{font:30px serif;margin:8px 0}p{color:#cdb1b0;line-height:1.65}button,select,input[type=number]{font:inherit;border:1px solid #824951;background:#40252b;color:#f1dedb;border-radius:8px;min-height:42px;padding:8px 12px}button:disabled{opacity:.4}.controls{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}label{display:inline-flex;align-items:center;gap:6px}input[type=number]{width:84px}#viewport{position:relative;width:100%;aspect-ratio:12/7;overflow:hidden;border:1px solid #824951;border-radius:12px}#stage{position:absolute;width:720px;height:420px;transform-origin:0 0;background:url('./stage-reference.webp') center/100% 100%}.sprite{position:absolute;background-repeat:no-repeat;pointer-events:none;transform-origin:var(--px) var(--py)}.trail{position:absolute;pointer-events:none;height:1px;background:linear-gradient(90deg,transparent,#d92d36);transform-origin:right center}#time{width:100%;accent-color:#d92d36}#phase{color:#ff7552}#error{color:#ffb9ae;white-space:pre-wrap}details{color:#cda0a0;margin:20px 0}pre{white-space:pre-wrap;font-size:12px}@media(max-width:600px){main{padding:18px 10px}h1{font-size:25px}}
</style><main><small>仙途 · 独立资源预览</small><h1>火系第三批 · 三招试播</h1><p>天火焚世 · 赤焰龙息 · 燎原火域</p>
<div class="controls"><label>技能<select id="effect"></select></label><label>灼烧状态<select id="burnState"><option value="active">火域灼烧生效</option><option value="expired">灼烧耗尽</option><option value="detonated">被炎爆消耗</option><option value="ordinary">其他技能灼烧</option><option value="lotus">红莲禁疗优先</option><option value="dead">目标死亡</option><option value="changed">切换目标</option></select></label><label>命中时刻<select id="arrival"><option value="310">正常</option><option value="180">提前</option><option value="520">延迟</option></select></label></div><div id="viewport"><div id="stage"></div></div><p id="phase" role="status">加载中</p><p id="error" role="alert"></p>
<input id="time" type="range" min="0" max="2400" step="1" value="0" aria-label="动画时间">
<div class="controls"><button id="play" disabled>播放</button><button id="restart" disabled>重播</button><button id="step" disabled>下一帧</button><label>速度<select id="speed"><option value="1">正常</option><option value=".25">四分之一慢放</option></select></label><label>帧率<select id="fps"><option>30</option><option>60</option><option>15</option></select></label><label><input id="loop" type="checkbox" checked>循环</label></div>
<div class="controls"><label>画质<select id="quality"><option value="rich">精致</option><option value="light">轻量</option><option value="reduced">减少动态</option></select></label><label><input id="hit" type="checkbox" checked>命中</label><label>背景<select id="background"><option value="stage">水墨战场</option><option value="light">浅色</option><option value="dark">深色</option></select></label></div>
<div class="controls"><label>缩放<input id="scale" type="number" value="1" min=".5" max="1.5" step=".1"></label><label>X 偏移<input id="offsetX" type="number" value="0" min="-100" max="100" step="5"></label><label>Y 偏移<input id="offsetY" type="number" value="0" min="-100" max="100" step="5"></label><button id="reset">恢复默认</button></div>
<details><summary>查看当前图层</summary><pre id="layers"></pre></details><p>此页为透明资源试播，角色底图仅作比例对照。这里模拟命中和灼烧状态，尚未接入实战。天火落点固定；龙息逐段推进；火域余焰随模拟灼烧结束清除。红莲禁疗优先时撤下火域，实战接入后由已有状态所有者显示莲印。</p></main>
<script src="definition.js"></script><script src="choreography.js"></script><script src="preview.js"></script></html>
