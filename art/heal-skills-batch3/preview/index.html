<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>青莲护心 · 莲华济世 · 动画预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#10201b;color:#e3ead8;font:16px system-ui}main{max-width:780px;margin:auto;padding:18px}h1{font-size:24px}button,select,input{font:inherit;margin:4px;padding:7px;background:#243e33;color:#eef0d8;border:1px solid #667a75;border-radius:6px}button{min-height:42px}.stage{position:relative;width:720px;height:420px;background:url(stage-reference.webp) center/100% 100%;overflow:hidden;transform-origin:top left}.clip{position:absolute;inset:85px 0 35px;overflow:hidden}.layer{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}.viewport{width:100%;overflow:hidden}#status{min-height:48px;color:#a0dbba;overflow-wrap:anywhere}label{display:inline-block}small{color:#a5b5a7}input[type=range]{width:100px}input[type=number]{width:90px}.simulation{position:absolute;top:50px;left:28px;padding:2px 5px;background:#18372e;color:#d4efd9;font-size:16px}.hp{position:absolute;left:29px;top:45px;width:181px;height:6px;background:#23352a}.hp>i{display:block;height:6px;background:#a3d196}#ratio{color:#bfddb2;margin:10px 0}.note{color:#d8c888}.controls{margin-top:16px}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #efd590}</style>
<main><h1>青莲护心 · 莲华济世</h1><p class="note">透明动画资源试播 · 尚未接入正式游戏</p><div class="viewport"><div class="stage"><div class="hp"><i id="hpFill"></i></div><div class="simulation" id="hpText"></div><div class="clip" id="effects"></div></div></div><div id="ratio"></div><div id="status" role="status"></div>
<div class="controls"><label>技能<select id="skill"></select></label><button id="play">暂停</button><button id="restart">重播</button><button id="step">下一帧</button><br>
<label>演示情形<select id="scenario"><option value="hit">治疗＋护持，1600ms受击</option><option value="hold">护持持续，不受击</option><option value="early">300ms提前受击</option><option value="replace">1000ms被更强护持替换</option></select></label><br>
<label><input type="checkbox" id="heal" checked>模拟缺血</label><label><input type="checkbox" id="guard" checked>本次施法获得护持</label><label><input type="checkbox" id="cancel">模拟退出</label><label><input type="checkbox" id="loop" checked>循环演示</label><br>
<label>速度<select id="speed"><option value="1">正常</option><option value="0.5">半速</option></select></label><label>帧率<select id="fps"><option value="30">30 FPS</option><option value="60">60 FPS</option><option value="15">15 FPS</option></select></label><label>画质<select id="quality"><option value="full">完整</option><option value="low">轻量</option></select></label><label><input type="checkbox" id="reduced">减少动态</label><br>
<label>背景<select id="bg"><option value="stage">游戏场景</option><option value="#e7e0c8">浅色</option><option value="#59676b">中灰</option><option value="#101920">深色</option></select></label><label>缩放<input type="range" id="scale" min="0.6" max="1.3" step="0.05" value="1"></label><label>X<input id="x" type="number" min="-80" max="80" value="0"></label><label>Y<input id="y" type="number" min="-40" max="40" value="0"></label></div>
<p><small>满血省去治疗归身，仍可建立护持。取消“本次施法获得护持”可模拟较弱护持未覆盖旧状态。演示中的受击时点只用于检验动画，正式接入将由真实战斗事件驱动。此页面不读取或修改游戏存档。</small></p></main><script src="definition.js"></script><script src="choreography.js"></script><script src="preview.js"></script></html>
