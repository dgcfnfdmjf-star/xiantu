<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:, "><title>剑系第一批 · 资源预览</title><style>
body{margin:0;background:#101920;color:#e2dfcc;font:16px system-ui}main{max-width:760px;margin:auto;padding:18px}h1{font-size:24px}button,select,input{font:inherit;margin:4px;padding:8px;background:#253a42;color:#eef0d8;border:1px solid #667a75;border-radius:6px}.stage{position:relative;width:720px;height:420px;background:url(stage-reference.webp) center/100% 100%;overflow:hidden;transform-origin:top left}.clip{position:absolute;inset:85px 0 35px;overflow:hidden}.layer{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}.viewport{width:100%;overflow:hidden}#status{min-height:30px;color:#9de0df}label{display:inline-block}small{color:#9aaea5}input[type=range]{width:130px}</style>
<main><h1>御剑术 · 万剑归宗 · 天地一剑</h1><p>透明动画资源试播 · 尚未接入游戏。背景角色为固定参照。</p><select id="skill"></select><button id="play">暂停</button><button id="restart">重播</button><button id="step">下一帧</button><label><input type="checkbox" id="loop" checked>循环</label><label><input type="checkbox" id="light">轻量</label><label><input type="checkbox" id="reduced">减少动态</label><br><label>速度<select id="speed"><option value="1">正常</option><option value="0.5">半速</option></select></label><label>缩放<input type="range" id="scale" min="0.6" max="1.3" step="0.05" value="1"></label><label>X<input id="x" type="number" min="-80" max="80" value="0"></label><label>Y<input id="y" type="number" min="-40" max="40" value="0"></label><div id="status"></div><div class="viewport"><div class="stage"><div class="clip" id="effects"></div></div></div><p><small>预览使用模拟命中时间；接入时绑定真实命中，不增加伤害次数。顶部血条区域不绘制特效。</small></p></main><script src="definition.js"></script><script src="choreography.js"></script><script src="preview.js"></script></html>
