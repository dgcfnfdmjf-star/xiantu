<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:, "><title>剑系第三批 · 资源预览</title><style>
body{margin:0;background:#101920;color:#e2dfcc;font:16px system-ui}main{max-width:760px;margin:auto;padding:18px}h1{font-size:24px}button,select,input{font:inherit;margin:4px;padding:8px;background:#253a42;color:#eef0d8;border:1px solid #667a75;border-radius:6px}.stage{position:relative;width:720px;height:420px;background:url(stage-reference.webp) center/100% 100%;overflow:hidden;transform-origin:top left}.clip{position:absolute;inset:85px 0 35px;overflow:hidden}.layer{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}.viewport{width:100%;overflow:hidden}#status{min-height:30px;color:#9de0df}label{display:inline-block}small{color:#9aaea5}input[type=range]{width:130px}</style>
<main><h1>追魂一剑 · 饮血剑诀 · 玄罡护体剑</h1><p>透明动画资源试播 · 尚未接入游戏。背景角色为固定参照。</p><select id="skill"></select><button id="play">暂停</button><button id="restart">重播</button><button id="step">下一帧</button><label><input type="checkbox" id="loop" checked>循环</label><label><input type="checkbox" id="light">轻量</label><label><input type="checkbox" id="reduced">减少动态</label><label><input type="checkbox" id="heal" checked>模拟实际回血</label><label><input type="checkbox" id="guard" checked>模拟护体</label><label><input type="checkbox" id="miss">未命中</label><label>护体消耗时间<input id="guardEnd" type="number" min="400" max="2000" step="100" value="1600"></label><br><label>速度<select id="speed"><option value="1">正常</option><option value="0.5">半速</option></select></label><label>帧率<select id="fps"><option value="30">30 FPS</option><option value="60">60 FPS</option><option value="15">15 FPS</option></select></label><label>背景<select id="bg"><option value="stage">游戏场景</option><option value="#e7e0c8">浅色</option><option value="#59676b">中灰</option><option value="#101920">深色</option></select></label><label>缩放<input type="range" id="scale" min="0.6" max="1.3" step="0.05" value="1"></label><label>X<input id="x" type="number" min="-80" max="80" value="0"></label><label>Y<input id="y" type="number" min="-40" max="40" value="0"></label><div id="status"></div><div class="viewport"><div class="stage"><div class="clip" id="effects"></div></div></div><p><small>预览模拟310ms命中、实际回血及护体于1600ms消耗；可关闭模拟验证表现。尚未接入真实战斗。顶部血条区域不绘制特效。</small></p></main><script src="definition.js"></script><script src="choreography.js"></script><script src="preview.js"></script></html>
