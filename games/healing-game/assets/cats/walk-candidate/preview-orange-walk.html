<!doctype html>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob:; object-src 'none'; base-uri 'none'">

  <title>橘猫走路候选 · 未通过验收</title>
  <style>
    :root{color-scheme:light;--ink:#49483e;--muted:#797a6b;--paper:#f5f2e9;--line:#d9d6c8;--green:#65755e}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
    body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at 20% 4%,#dce2d151,transparent 45%),radial-gradient(ellipse at 96% 82%,#e2d5b643,transparent 36%),var(--paper)}
    main{width:min(1080px,100%);margin:auto;padding:24px max(20px,env(safe-area-inset-right)) 20px max(20px,env(safe-area-inset-left))}
    h1{font-family:Georgia,"Songti SC",serif;font-size:27px;font-weight:500;letter-spacing:.08em;margin:0 0 8px}
    .candidate{display:inline-block;padding:5px 10px;border:1px solid #a66f57;border-radius:6px;color:#85553f;font-size:12px;letter-spacing:.08em;margin-bottom:10px}

    .stage{position:relative;height:clamp(360px,65vh,660px);overflow:hidden;border:1px solid var(--line);border-radius:20px;background:radial-gradient(ellipse at 50% 60%,#fffdf7 0%,#f3f0e6 68%,#eaeade 100%)}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}canvas:active{cursor:grabbing}canvas:focus-visible{outline:3px solid var(--green);outline-offset:-5px}
    .stage-label{position:absolute;top:17px;left:20px;right:20px;font-size:12px;color:var(--muted);letter-spacing:.08em;line-height:1.7;pointer-events:none}
    .status{position:absolute;bottom:17px;left:20px;right:20px;margin:0;font-size:12px;color:var(--muted);text-align:center;pointer-events:none}
    .error{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:#f5f2e9e8;text-align:center;line-height:1.8;font-size:14px}
    [hidden]{display:none!important}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}.group{display:flex;gap:8px;flex-wrap:wrap}
    button{appearance:none;min-height:44px;padding:9px 18px;border:1px solid var(--line);border-radius:24px;background:#faf8f1;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}button:hover{border-color:#94a087;background:#edf0e5}button:focus-visible{outline:3px solid #839575;outline-offset:3px}button:disabled{opacity:.45;cursor:default}button[aria-pressed="true"]{border-color:var(--green);background:#e8ecdf;color:#4e6248}
    .help{margin:12px 0 0;text-align:center;font-size:12px;color:var(--muted);line-height:1.7}footer{margin-top:18px;font-size:11px;line-height:1.7;color:var(--muted);overflow-wrap:anywhere}footer p{margin:0}
    @media(max-width:600px){main{padding-top:18px}h1{font-size:23px}.stage{height:clamp(360px,62vh,600px);border-radius:16px}.toolbar{gap:8px}.group{gap:6px}button{padding:9px 15px}.stage-label{left:16px}.subtitle{font-size:12px}footer{margin-top:14px}}
    @media(max-height:500px) and (orientation:landscape){main{padding-top:10px;padding-bottom:10px}h1{font-size:20px;margin-bottom:5px}.candidate{margin-bottom:5px}.subtitle{display:none}.stage{height:calc(100vh - 194px);min-height:170px}.stage-label{top:12px}.status{display:none}.toolbar{margin-top:8px}.help{margin-top:5px}footer{margin-top:6px}}
  </style>
</head>
<body>
<main>
  <header><span class="candidate">候选版本 · 未通过验收</span><h1>橘猫走路候选</h1><p class="subtitle">仅供查看当前候选的坐姿与步态，尚未接入游戏。可切换动作并拖动观察。</p></header>
  <section class="stage" aria-label="橘猫候选三维预览">
    <canvas id="cat-canvas" tabindex="0" role="img" aria-label="橘猫候选模型。拖动旋转，滚轮或双指缩放。"></canvas>
    <span class="stage-label">橘猫 / 候选 V24<br>原始 Walk 片段 · 1× · 原地播放</span><p id="status" class="status" role="status" aria-live="polite">正在读取候选文件…</p>
    <div id="error" class="error" role="alert" hidden></div>
  </section>
  <nav class="toolbar" aria-label="调整动作与视角">
    <div class="group" role="group" aria-label="动作"><button type="button" data-motion="sit" aria-pressed="true" disabled>坐姿</button><button type="button" data-motion="walk" aria-pressed="false" disabled>走路</button></div>
    <div class="group" role="group" aria-label="视角"><button type="button" data-view="front" aria-pressed="true" disabled>正面</button><button type="button" data-view="side" aria-pressed="false" disabled>侧面</button></div>
  </nav>
  <p class="help">拖动旋转 · 滚轮或双指缩放</p>
  <footer><p>文件：orange-cat-walk-v24.glb</p><p id="metrics">候选尚未加载</p><p>已知问题：胸口与前腿仍有细缝；臀部、尾根及脚掌的封口面仍可辨认；后腿跗关节转折偏硬。</p><p>此页不读取游戏或玩家存档，也不修改模型。</p></footer>
</main>
<script src="../vendor/three-r128/three.min.js"></script>
<script src="../vendor/three-r128/GLTFLoader.js"></script>
<script src="../vendor/three-r128/OrbitControls.js"></script>
<script>
(() => {
  'use strict';
  const FILE = 'orange-cat-walk-v24.glb';
  const EXPECTED_BYTES = 380140;
  const EXPECTED_SHA = 'c992a7fa4294ee4d3fd9331dba484096010f5b19ba222a565feca343a25d4fb1';
  const canvas = document.getElementById('cat-canvas');
  const status = document.getElementById('status');
  let renderer, scene, camera, controls, model, mixer, action, clip, center, sphere;
  let state = 'loading', motion = 'sit', view = 'front', playing = false, contextLost = false;
  let frame = 0, lastTime = null, renderedFrames = 0, fittedDistance = 2, triangles = 0, skinnedMeshes = 0, sha256 = null;
  function pauseFrames() { if (frame) cancelAnimationFrame(frame); frame = 0; lastTime = null; }
  function mark() {
    document.querySelectorAll('[data-motion]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.motion === motion)));
    document.querySelectorAll('[data-view]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
    status.textContent = motion === 'walk' ? (playing ? '走路候选 · 轻轻拖动，查看不同角度' : '走路候选 · 当前帧定格') : '坐姿候选 · 轻轻拖动，查看不同角度';
  }
  function draw() {
    if (!renderer || document.hidden || contextLost) return;
    renderer.render(scene, camera); renderedFrames++;
  }
  function requestRender() {
    if (frame || document.hidden || contextLost || !renderer) return;
    frame = requestAnimationFrame(now => {
      frame = 0;
      if (document.hidden || contextLost) { lastTime = null; return; }
      if (state === 'ready' && playing && action) {
        const dt = lastTime === null ? 0 : Math.max((now - lastTime) / 1000, 0);
        lastTime = now; mixer.update(dt);
      } else lastTime = null;
      draw();
      if (state === 'ready' && playing) requestRender();
    });
  }
  function setMotion(next) {
    if (state !== 'ready' || !['sit', 'walk'].includes(next)) return false;
    pauseFrames();
    if (next === 'sit') { action.stop(); mixer.update(0); playing = false; }
    else {
      if (motion !== 'walk') action.reset().setLoop(THREE.LoopRepeat, Infinity).play();
      action.paused = false; playing = true; mixer.update(0);
    }
    motion = next; model.updateMatrixWorld(true); mark(); requestRender(); return true;
  }
  function setPhase(phase) {
    if (state !== 'ready' || !Number.isFinite(phase)) return false;
    pauseFrames();
    action.reset().setLoop(THREE.LoopRepeat, Infinity).play();
    action.paused = true; action.time = Math.min(1, Math.max(0, phase)) * clip.duration;
    mixer.update(0); model.updateMatrixWorld(true);
    motion = 'walk'; playing = false; mark(); draw(); return true;
  }
  function fitDistance() {
    const vertical = THREE.MathUtils.degToRad(camera.fov / 2);
    const horizontal = Math.atan(Math.tan(vertical) * camera.aspect);
    fittedDistance = sphere.radius / Math.sin(Math.min(vertical, horizontal)) * 1.10;
    controls.minDistance = sphere.radius * 1.28; controls.maxDistance = fittedDistance * 2.8;
    camera.near = Math.max(sphere.radius / 100, .001); camera.far = controls.maxDistance + sphere.radius * 8;
    camera.updateProjectionMatrix();
  }
  function setView(next) {
    if (!model || !['front', 'side'].includes(next)) return false;
    view = next; controls.target.copy(center);
    const angle = next === 'side' ? Math.PI / 2 : 0;
    camera.position.set(center.x + Math.sin(angle) * fittedDistance, center.y + fittedDistance * .08, center.z + Math.cos(angle) * fittedDistance);
    controls.update(); mark(); requestRender(); return true;
  }
  function resize() {
    if (!renderer) return;
    const { width, height } = canvas.getBoundingClientRect(); if (!width || !height) return;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); renderer.setSize(width, height, false);
    camera.aspect = width / height;
    if (model) {
      const ratio = camera.position.distanceTo(controls.target) / fittedDistance;
      const direction = camera.position.clone().sub(controls.target).normalize();
      fitDistance();
      camera.position.copy(controls.target).addScaledVector(direction, Math.min(controls.maxDistance, Math.max(controls.minDistance, fittedDistance * ratio)));
      controls.update();
    } else camera.updateProjectionMatrix();
    requestRender();
  }
  function showError(message) {
    pauseFrames(); state = 'error'; status.hidden = true;
    const box = document.getElementById('error'); box.textContent = message; box.hidden = false;
    document.querySelectorAll('button').forEach(button => { button.disabled = true; });
  }
  function showReady() {
    state = 'ready'; document.getElementById('error').hidden = true; status.hidden = false;
    document.querySelectorAll('button').forEach(button => { button.disabled = false; }); mark(); requestRender();
  }
  async function load() {
    const response = await fetch(FILE, { cache: 'no-store' });
    if (!response.ok) throw new Error('候选文件下载失败');
    const bytes = await response.arrayBuffer();
    if (bytes.byteLength !== EXPECTED_BYTES) throw new Error('候选文件大小不符');
    if (window.crypto && crypto.subtle) {
      sha256 = [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map(n => n.toString(16).padStart(2, '0')).join('');
      if (sha256 !== EXPECTED_SHA) throw new Error('候选文件校验不符');
    }
    const gltf = await new Promise((resolve, reject) => new THREE.GLTFLoader().parse(bytes, new URL('.', location.href).href, resolve, reject));
    model = gltf.scene; clip = THREE.AnimationClip.findByName(gltf.animations, 'Walk');
    if (!clip) throw new Error('候选缺少 Walk 片段');
    model.traverse(node => {
      if (!node.isMesh) return;
      const geometry = node.geometry; triangles += (geometry.index ? geometry.index.count : geometry.attributes.position.count) / 3;
      if (node.isSkinnedMesh) skinnedMeshes++;
    });
    scene.add(model); mixer = new THREE.AnimationMixer(model); action = mixer.clipAction(clip);
    const bounds = new THREE.Box3().setFromObject(model);
    sphere = bounds.getBoundingSphere(new THREE.Sphere()); center = bounds.getCenter(new THREE.Vector3());
    fitDistance(); setView('front');
    document.getElementById('metrics').textContent = `${triangles.toLocaleString('zh-CN')} 个三角面 · Walk ${clip.duration.toFixed(1)} 秒循环 · 未通过验收`;
    if (contextLost) showError('三维显示暂时中断，恢复后可继续查看候选。'); else showReady();
  }
  try {
    if (!window.THREE || !THREE.GLTFLoader || !THREE.OrbitControls) throw new Error('缺少本地三维预览组件');
    renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'low-power' });
    renderer.outputEncoding = THREE.sRGBEncoding; renderer.setClearColor(0x000000, 0);
    scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(32, 1, .01, 100); camera.position.set(0, .5, 2);
    controls = new THREE.OrbitControls(camera, canvas); controls.enablePan = false; controls.enableDamping = false;
    controls.rotateSpeed = .7; controls.zoomSpeed = .8; controls.minPolarAngle = .20; controls.maxPolarAngle = Math.PI * .52;
    controls.addEventListener('change', requestRender);
    controls.addEventListener('start', () => { view = 'custom'; mark(); });
    scene.add(new THREE.HemisphereLight(0xffffff, 0xc3c5bb, .6));
    const key = new THREE.DirectionalLight(0xffffff, .65); key.position.set(-3, 4, 5); scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, .2); fill.position.set(3, 2, -3); scene.add(fill);
    const shadowCanvas = document.createElement('canvas'); shadowCanvas.width = shadowCanvas.height = 64;
    const context = shadowCanvas.getContext('2d'), gradient = context.createRadialGradient(32, 32, 3, 32, 32, 30);
    gradient.addColorStop(0, 'rgba(84,73,51,0.20)'); gradient.addColorStop(1, 'rgba(84,73,51,0)');
    context.fillStyle = gradient; context.fillRect(0, 0, 64, 64);
    const shadow = new THREE.Mesh(new THREE.PlaneGeometry(.95, .7), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowCanvas), transparent: true, depthWrite: false }));
    shadow.rotation.x = -Math.PI / 2; shadow.position.y = -.002; scene.add(shadow);
    canvas.addEventListener('webglcontextlost', event => { event.preventDefault(); contextLost = true; pauseFrames(); showError('三维显示暂时中断，恢复后可继续查看候选。'); });
    canvas.addEventListener('webglcontextrestored', () => { contextLost = false; if (model && action) showReady(); });
    document.addEventListener('visibilitychange', () => { pauseFrames(); if (!document.hidden) requestRender(); });
    window.addEventListener('resize', resize); new ResizeObserver(resize).observe(canvas.parentElement);
    document.querySelectorAll('[data-motion]').forEach(button => button.addEventListener('click', () => setMotion(button.dataset.motion)));
    document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => setView(button.dataset.view)));
    resize(); load().catch(error => showError(`候选暂时无法显示：${error.message}。请通过本地网页服务打开此页面。`));
  } catch (error) { showError(`三维预览无法启动：${error.message}。`); }
  // Dedicated review-only controls: no game, asset or player-state mutation.
  window.catWalkCandidate = Object.freeze({ setMotion, setView, setPhase, render: draw });
  Object.defineProperty(window, '__catWalkCandidate', { get: () => {
    const rect = canvas.getBoundingClientRect();
    return Object.freeze({ state, motion, playing, view, filename: FILE, sha256, expectedSHA256: EXPECTED_SHA,
      bytes: EXPECTED_BYTES, triangles, skinnedMeshes, animationTime: action ? action.time : 0,
      phase: action && clip ? action.time / clip.duration : 0, duration: clip ? clip.duration : 0, timeScale: action ? action.timeScale : 1,
      renderedFrames, pendingFrame: Boolean(frame), contextLost,
      canvasBoundingRect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },
      camera: camera ? { position: camera.position.toArray(), quaternion: camera.quaternion.toArray(), fov: camera.fov,
        target: controls.target.toArray(), distance: camera.position.distanceTo(controls.target), fittedDistance, near: camera.near, far: camera.far, aspect: camera.aspect } : null,
      dpr: renderer ? renderer.getPixelRatio() : null
    });
  } });
})();
</script>
