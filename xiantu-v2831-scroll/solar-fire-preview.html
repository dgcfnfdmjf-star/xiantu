<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>太阳真火 · 四阶段试演</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102321;color:#f2e9cf;font:15px system-ui}main{max-width:940px;margin:auto;padding:24px 16px}h1{font:30px serif;margin:8px 0}p{color:#b8c5b3;line-height:1.7}a{color:#f5cd87}button,select{font:inherit;border:1px solid #8f794a;background:#2c4037;color:#f5e4bb;border-radius:9px;min-height:44px;padding:8px 14px}button:hover{background:#4c563c}button:disabled{opacity:.4}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}label{display:inline-flex;gap:7px;align-items:center}#viewport{width:100%;aspect-ratio:12/7;overflow:hidden;border-radius:14px;border:1px solid #8f794a;position:relative}#stage{width:720px;height:420px;position:absolute;transform-origin:0 0;background:linear-gradient(#102c38dc,#19342e18 25%,#233e3555),url('./scroll-landscape-v2831.webp') center/100% 100%}.sprite{position:absolute;pointer-events:none;background-repeat:no-repeat;transform-origin:var(--pivot-x) var(--pivot-y)}.marker{position:absolute;font:15px serif;color:#fff0c4;text-shadow:0 1px 3px #000}.marker:first-child{left:238px;top:315px}.marker:nth-child(2){left:473px;top:290px}input[type=range]{width:100%;accent-color:#e9a952}#phase{color:#f2ce8e}footer{margin-top:24px;border-top:1px solid #526847;padding-top:16px}#error{color:#ffc8ac;white-space:pre-wrap}@media(max-width:600px){main{padding:20px 10px}h1{font-size:26px}}
</style>
<main><small>仙途 / 招式试演</small><h1>太阳真火</h1><p>凝阳 · 逐日 · 日焰爆发 · 余烬</p>
<div id="viewport"><div id="stage"><span class="marker">施法者</span><span class="marker">落点</span></div></div>
<p id="phase" role="status">正在准备画面…</p><p id="error" role="alert"></p>
<input id="time" type="range" min="0" max="900" value="0" step="1" aria-label="动画时间">
<div class="controls"><button id="play">播放</button><button id="restart">重新播放</button><button id="step">下一帧</button><label>速度 <select id="speed"><option value="1">正常</option><option value=".25">慢放</option></select></label><label><input id="loop" type="checkbox" checked>循环</label></div>
<div class="controls"><label>画质 <select id="quality"><option value="rich">精致</option><option value="light">轻量</option><option value="reduced">减少动态</option></select></label><label><input id="hit" type="checkbox" checked>命中</label><label>背景 <select id="background"><option value="stage">水墨战场</option><option value="light">浅色</option><option value="dark">深色</option></select></label></div>
<footer><a href="./battle-25d-preview.html?skill=%E5%A4%AA%E9%98%B3%E7%9C%9F%E7%81%AB">进入角色与怪物同台试演 →</a><p>此页只预览招式，不读取角色存档。</p></footer></main>
<script src="./xiantu-v2855-skill-fx.js?v=286831"></script>
<script>
const solar=InkSkillFxV2854.solar,stage=document.getElementById('stage'),viewport=document.getElementById('viewport'),time=document.getElementById('time'),play=document.getElementById('play'),phase=document.getElementById('phase');
let age=0,playing=false,last=0,clock=0;
const sprites=Object.fromEntries(Object.entries(solar.definition.layers).map(([name,layer])=>{const el=document.createElement('div');el.className='sprite';el.dataset.layer=name;el.style.backgroundImage=`url('./solar-fire-v286830/${layer.file}')`;stage.appendChild(el);return [name,el]}));
solar.prepare();
function job(){return {profile:InkSkillFxV2854.profile('太阳真火'),from:{x:260,y:225},to:{x:493,y:225},fromGround:{x:242,y:305},toGround:{x:493,y:278},width:720,clipBottom:355,scale:1.05,duration:900,arriveAt:310,hitAt:document.getElementById('hit').checked?310:null,light:document.getElementById('quality').value==='light',reduced:document.getElementById('quality').value==='reduced'}}
function render(){
 const parts=solar.sample(job(),age);Object.values(sprites).forEach(el=>el.hidden=true);
 for(const p of parts){const el=sprites[p.layer],meta=solar.definition.layers[p.layer];el.hidden=false;Object.assign(el.style,{left:(p.x-p.width*p.pivotX)+'px',top:(p.y-p.height*p.pivotY)+'px',width:p.width+'px',height:p.height+'px',opacity:p.opacity,backgroundSize:`${meta.frames*p.width}px ${p.height}px`,backgroundPosition:`${-p.frame*p.width}px 0`,transform:`rotate(${p.rotation}rad)`});el.style.setProperty('--pivot-x',p.pivotX*100+'%');el.style.setProperty('--pivot-y',p.pivotY*100+'%')}
 phase.textContent=(age<108?'凝阳':age<310?'逐日':age<490?'日焰爆发':age<850?'余烬':'结束')+' · '+Math.round(age)+' ms'+(!document.getElementById('hit').checked?' · 未命中':'');time.value=age;
}
function pause(){playing=false;play.textContent='播放';cancelAnimationFrame(clock);clock=0}
function tick(now){clock=0;if(!playing||document.hidden)return;age+=Math.min(80,now-last)*Number(document.getElementById('speed').value);last=now;if(age>900){if(document.getElementById('loop').checked)age=0;else{age=900;pause()}}render();if(playing)clock=requestAnimationFrame(tick)}
function start(){if(playing)return;playing=true;last=performance.now();play.textContent='暂停';clock=requestAnimationFrame(tick)}
play.onclick=()=>playing?pause():start();document.getElementById('restart').onclick=()=>{pause();age=0;render();start()};document.getElementById('step').onclick=()=>{pause();age=Math.min(900,age+1000/30);render()};time.oninput=()=>{pause();age=Number(time.value);render()};
for(const id of ['quality','hit'])document.getElementById(id).onchange=render;
document.getElementById('background').onchange=e=>{stage.style.background=e.target.value==='stage'?'':e.target.value==='light'?'#e8dec2':'#17292b'};
function resize(){stage.style.transform=`scale(${viewport.clientWidth/720})`}window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('pagehide',pause);resize();render();
Promise.all(Object.values(solar.definition.layers).map(meta=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>im.naturalWidth===meta.frames*meta.frameWidth&&im.naturalHeight===meta.frameHeight?resolve():reject(new Error('素材尺寸不正确：'+meta.file));im.onerror=()=>reject(new Error('素材加载失败：'+meta.file));im.src='./solar-fire-v286830/'+meta.file}))).catch(error=>{pause();document.getElementById('error').textContent=error.message;play.disabled=true});
</script></html>
