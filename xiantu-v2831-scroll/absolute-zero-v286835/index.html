<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>绝对零度 · 资源试播</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102631;color:#f1dedb;font:15px system-ui}main{max-width:940px;margin:auto;padding:22px 16px}h1{font:30px serif;margin:8px 0}p{color:#cdb1b0;line-height:1.65}button,select,input[type=number]{font:inherit;border:1px solid #568aa5;background:#193b4a;color:#f1dedb;border-radius:8px;min-height:42px;padding:8px 12px}button:disabled{opacity:.4}.controls{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}label{display:inline-flex;align-items:center;gap:6px}input[type=number]{width:84px}#viewport{position:relative;width:100%;aspect-ratio:12/7;overflow:hidden;border:1px solid #568aa5;border-radius:12px}#stage{position:absolute;width:720px;height:420px;transform-origin:0 0;background:url('./stage-reference.webp') center/100% 100%}.sprite{position:absolute;background-repeat:no-repeat;pointer-events:none;transform-origin:var(--px) var(--py)}.trail{position:absolute;pointer-events:none;height:1px;background:linear-gradient(90deg,transparent,#58c1e9);transform-origin:right center}#time{width:100%;accent-color:#58c1e9}#phase{color:#87dfff}#error{color:#ffb9ae;white-space:pre-wrap}details{color:#cda0a0;margin:20px 0}pre{white-space:pre-wrap;font-size:12px}@media(max-width:600px){main{padding:18px 10px}h1{font-size:25px}}
</style><main><small>仙途 · 独立资源预览</small><h1>绝对零度</h1><p>凝霜引寒 · 霜环扩散 · 玄冰封境 · 碎晶归寂</p>
<div id="viewport"><div id="stage"></div></div><p id="phase" role="status">加载中</p><p id="error" role="alert"></p>
<input id="time" type="range" min="0" max="900" step="1" value="0" aria-label="动画时间">
<div class="controls"><button id="play" disabled>播放</button><button id="restart" disabled>重播</button><button id="step" disabled>下一帧</button><label>速度<select id="speed"><option value="1">正常</option><option value=".25">四分之一慢放</option></select></label><label>帧率<select id="fps"><option>30</option><option>60</option><option>15</option></select></label><label><input id="loop" type="checkbox" checked>循环</label></div>
<div class="controls"><label>画质<select id="quality"><option value="rich">精致</option><option value="light">轻量</option><option value="reduced">减少动态</option></select></label><label><input id="hit" type="checkbox" checked>命中</label><label>背景<select id="background"><option value="stage">水墨战场</option><option value="light">浅色</option><option value="dark">深色</option></select></label></div>
<div class="controls"><label>缩放<input id="scale" type="number" value="1" min=".5" max="1.5" step=".1"></label><label>X 偏移<input id="offsetX" type="number" value="0" min="-100" max="100" step="5"></label><label>Y 偏移<input id="offsetY" type="number" value="0" min="-100" max="100" step="5"></label><button id="reset">恢复默认</button></div>
<details><summary>查看当前图层</summary><pre id="layers"></pre></details><p>此页为透明资源试播，角色底图用于比例对照。实际寒迟与冻结沿用原游戏逻辑。</p></main>
<script src="definition.js"></script><script src="choreography.js"></script><script src="preview.js"></script></html>
