name: Healing game
on:
  push:
    paths:
      - 'games/healing-game/**'
      - '.github/workflows/healing-game.yml'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'games/healing-game/**'
      - '.github/workflows/healing-game.yml'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: healing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cats-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compact animated GLB binary format
        run: python3 games/healing-game/assets/cats/tests/test_compact_skin_glb.py
      - run: python3 games/healing-game/tests/test_package.py
      - name: Verify committed game package is reproducible
        run: git diff --exit-code -- games/healing-game/site games/healing-game/releases
      - name: Four-cat model and preview browser checks
        run: node games/healing-game/assets/cats/tests/preview-cat-orange.cjs
      - name: Cat animation mixer and instance lifecycle
        run: node games/healing-game/tests/cat-walk-runtime.cjs
      - name: Confirmed garden reset and storage ownership
        run: node games/healing-game/tests/garden-reset.cjs && node games/healing-game/tests/garden-reset-browser.cjs
      - name: Chapter-two model interactions and lifecycle
        run: node games/healing-game/tests/cat-models-browser.cjs
      - name: Cat walking animation browser regression
        run: node games/healing-game/tests/cat-walk-browser.cjs
      - name: Four-coat paw contact and actual-distance cadence
        run: node games/healing-game/tests/cat-gait-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: healing-cat-browser-results
          path: |
            output/playwright/cat-orange/
            output/playwright/cat-variants/
            output/playwright/cat-models/
            output/playwright/cat-walk/
            output/playwright/cat-gait/
            output/playwright/garden-reset/
